<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a51890"><title>Wellbeing Game</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="phone.css"><link rel="stylesheet" href="wellbeing.css"><script src="config.js" defer></script><script src="audio.js" defer></script><script src="app.js" defer></script><script src="phone.js" defer></script></head>
<body><header><div class="brand">AIRBUS <button id="settingsButton" class="icon" aria-label="Open settings">⚙</button></div><span>WELLBEING · CONNECT & CARE</span></header><main id="app" tabindex="-1"><p>Preparing your game…</p></main><div id="announcement" class="sr" role="status" aria-live="polite"></div><div id="toast" role="status"></div>
<dialog id="settings" aria-labelledby="soundTitle"><div class="spread"><h2 id="soundTitle">Sound settings</h2><button type="button" class="icon closeSettings" aria-label="Close settings">✕</button></div><p>Choose the sound that suits you.</p><label class="check"><input id="music" type="checkbox" checked> Background music</label><label class="check"><input id="effects" type="checkbox" checked> Sound effects</label></dialog>
<dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="actions"><button id="confirmNo">Keep playing</button><button id="confirmYes" class="primary">Confirm</button></div></dialog>
</body></html>
